server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # This is a standalone HTML application; avoid stale UI code after upgrades.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
